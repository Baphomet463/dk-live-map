<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DK Live Map — Festival &amp; Venue Network in Denmark</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <h1>DK Live Map</h1>
  <p class="subtitle">Festival &amp; concert venue network in Denmark — click a site to manage it</p>
  <span id="count" class="count"></span>
</header>
<div id="layout">
  <aside id="sidebar">
    <input id="search" type="search" placeholder="Search name, city, address, notes…" autocomplete="off">
    <div id="filters">
      <div id="category-filters"></div>
      <select id="capacity-filter" aria-label="Minimum capacity"></select>
      <label class="chip"><input type="checkbox" id="toggle-partners" checked> Partner links</label>
    </div>
    <div id="toolbar">
      <button id="export-btn" type="button">Export JSON</button>
      <label id="import-label" class="tool-btn">Import JSON<input id="import-file" type="file" accept="application/json,.json" hidden></label>
      <button id="reset-btn" type="button">Reset edits</button>
      <span id="io-status"></span>
    </div>
    <ul id="venue-list"></ul>
    <div id="legend"></div>
  </aside>
  <div id="map"></div>
</div>
<aside id="editor" hidden>
  <div class="editor-head">
    <h2 id="editor-title">Edit site</h2>
    <button id="editor-close" type="button" aria-label="Close editor">✕</button>
  </div>
  <div class="editor-body">
    <p class="editor-coords" id="editor-coords"></p>
    <div class="form-grid">
      <label class="span2">Name<input id="f-name" type="text"></label>
      <label>Category<select id="f-category"></select></label>
      <label>City<input id="f-city" type="text"></label>
      <label class="span2">Address<input id="f-address" type="text" placeholder="Street, postal code, city"></label>
      <label>Capacity<input id="f-capacity" type="number" min="0" step="1"></label>
      <label>Founded<input id="f-founded" type="number" min="1800" max="2030" placeholder="year"></label>
      <label class="span2">Website<input id="f-website" type="url" placeholder="https://…"></label>
    </div>
    <label class="block">Description<textarea id="f-description" rows="2"></textarea></label>
    <label class="block">Notes<textarea id="f-notes" rows="3" placeholder="Free notes about this site…"></textarea></label>
    <h3>Contacts</h3>
    <div id="contacts"></div>
    <button id="add-contact" type="button">+ Add contact</button>
    <h3>Key partners</h3>
    <input id="partner-search" type="search" placeholder="Filter sites…" autocomplete="off">
    <div id="partners-list"></div>
    <div class="editor-actions">
      <button id="editor-save" type="button">Save</button>
      <span id="save-status"></span>
    </div>
  </div>
</aside>
<button id="sidebar-toggle" type="button">List</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
